<title>Guiones pendientes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column of status groups, like a night-shift board; the group to act on first sits on top. */
/* TOKENS-START */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #14202e;
  --muted: #5b6b7c;
  --line: #d5dce4;
  --cyan: #0a7f99;
  --rose: #c92a5f;
  --amber: #a86a00;
  --green: #1f7a4d;
  --cyan-bg: #dff3f8;
  --rose-bg: #fbe3ec;
  --amber-bg: #fbefd2;
  --green-bg: #dcf2e6;
  --f-display: 'Familjen Grotesk', 'Segoe UI', sans-serif;
  --f-body: 'Hanken Grotesk', 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1320; --surface: #121c2b; --ink: #e5ecf4; --muted: #92a2b4; --line: #26354a;
    --cyan: #47d4f2; --rose: #ff6b95; --amber: #f5b942; --green: #5ed39b;
    --cyan-bg: #10303b; --rose-bg: #3a1726; --amber-bg: #36290d; --green-bg: #11321f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1320; --surface: #121c2b; --ink: #e5ecf4; --muted: #92a2b4; --line: #26354a;
  --cyan: #47d4f2; --rose: #ff6b95; --amber: #f5b942; --green: #5ed39b;
  --cyan-bg: #10303b; --rose-bg: #3a1726; --amber-bg: #36290d; --green-bg: #11321f;
  color-scheme: dark;
}
/* TOKENS-END */
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 920px; margin: 0 auto; display: grid; gap: 28px; }
header { display: grid; gap: 6px; }
h1 { font: 700 30px/1.1 var(--f-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }
.stamp { font: 400 12px var(--f-mono); color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat {
  display: flex; align-items: baseline; gap: 8px; padding: 8px 14px; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--line);
}
.stat b { font: 700 24px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.stat.hot b { color: var(--rose); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools button, .tools input {
  font: 500 13px var(--f-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer;
}
.tools input { cursor: text; min-width: 0; flex: 1 1 180px; }
.tools button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
section { display: grid; gap: 10px; }
section > h2 {
  font: 700 13px/1 var(--f-display); text-transform: uppercase; letter-spacing: 0.1em; margin: 0;
  display: flex; align-items: center; gap: 10px; color: var(--muted);
}
section > h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
section > h2 .n { margin-left: auto; font-variant-numeric: tabular-nums; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c);
  border-radius: 6px; padding: 14px 16px; display: grid; gap: 10px;
}
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.top h3 { font: 700 17px/1.25 var(--f-display); margin: 0; flex: 1 1 260px; min-width: 0; text-wrap: balance; }
.tag { font: 500 12px var(--f-mono); padding: 2px 8px; border-radius: 4px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.tag.gcti { background: var(--cyan-bg); color: var(--cyan); }
.tag.secplus { background: var(--amber-bg); color: var(--amber); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 13px; }
.meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.paths { display: grid; gap: 6px; }
.path { display: flex; align-items: center; gap: 8px; min-width: 0; }
.path label { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); width: 58px; flex: none; }
.path code {
  font: 400 12px/1.4 var(--f-mono); background: var(--bg); border-radius: 4px; padding: 5px 8px;
  flex: 1 1 auto; min-width: 0; overflow-x: auto; white-space: nowrap;
}
.path button {
  flex: none; font: 600 12px var(--f-body); border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); border-radius: 5px; padding: 5px 10px; cursor: pointer;
}
.path button.ok { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.empty { color: var(--muted); font-style: italic; padding: 6px 0; }
details { border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; font: 700 13px var(--f-display); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
details .list { display: grid; gap: 6px; margin-top: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font-size: 14px; }
.row .slug { font: 400 12px var(--f-mono); color: var(--muted); }
.row .st { margin-left: auto; font-size: 12px; color: var(--muted); }
/*SHEETCSS*/
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  font: 600 13px var(--f-body); color: var(--bg); background: var(--ink); border: 1px solid var(--ink);
  border-radius: 6px; padding: 7px 14px; cursor: pointer; text-decoration: none; display: inline-block;
}
.btn.ghost { color: var(--ink); background: var(--surface); border-color: var(--line); }
.reader {
  position: fixed; inset: 0; z-index: 20; display: flex; justify-content: flex-end;
  background: rgba(8, 14, 24, 0.55);
}
.reader[hidden] { display: none; }
.reader .panel {
  width: min(760px, 100%); height: 100%; background: var(--surface); display: flex; flex-direction: column;
  border-left: 1px solid var(--line);
}
.reader .bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px 16px;
  border-bottom: 1px solid var(--line);
}
.reader .bar strong { font: 700 15px var(--f-display); flex: 1 1 200px; min-width: 0; }
.reader .scroll {
  overflow-y: auto; flex: 1; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(32px + env(safe-area-inset-bottom, 0px)) 16px;
}
.reader .note { color: var(--muted); }
@media (max-width: 520px) {
  .path { flex-wrap: wrap; }
  .path label { width: 100%; }
  h1 { font-size: 25px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main>
  <header>
    <h1>Guiones pendientes</h1>
    <p class="sub">Qué te falta grabar, qué ya grabaste y qué espera en producción. Cada tarjeta trae la ruta de la hoja de grabación y el nombre exacto del WAV.</p>
    <div class="stamp" id="stamp"></div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <button type="button" data-f="all" aria-pressed="true">Todos</button>
    <button type="button" data-f="secplus" aria-pressed="false">Security+</button>
    <button type="button" data-f="gcti" aria-pressed="false">GCTI</button>
    <input id="q" type="search" placeholder="Buscar por título, lección o clave" aria-label="Buscar">
  </div>
  <div id="groups"></div>
</main>
<div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-label="Hoja de grabación">
  <div class="panel">
    <div class="bar">
      <strong id="reader-title"></strong>
      <a class="btn ghost" id="reader-tab" target="_blank" rel="noopener">Abrir en pestaña</a>
      <button type="button" class="btn" id="reader-close">Cerrar</button>
    </div>
    <div class="scroll" id="reader-body"></div>
  </div>
</div>

<script>
const DATA = /*DATA*/null;
const GROUPS = [
  { key: 'por-grabar', label: 'Por grabar', c: 'var(--rose)', hint: 'Guion congelado y hoja lista. Grábalo y guarda el WAV con el nombre indicado.' },
  { key: 'grabado', label: 'Grabado, falta importar', c: 'var(--amber)', hint: 'Ya existe tu WAV; falta importarlo y comprobar las tomas.' },
  { key: 'importado', label: 'En producción', c: 'var(--cyan)', hint: 'Voz importada; falta montar, renderizar o subir.' },
  { key: 'renderizado', label: 'Renderizado', c: 'var(--cyan)', hint: 'Hay un MP4; falta subirlo y enlazarlo en la lección.' },
  { key: 'subido', label: 'Subido en privado', c: 'var(--amber)', hint: 'Está en YouTube en privado. Publícalo tú; después se enlaza en la lección.' },
  { key: 'publicado', label: 'Publicado, falta la lección', c: 'var(--cyan)', hint: 'Ya es público en YouTube; falta enlazarlo en la lección y en el registro de canon, y el merge.' },
  { key: 'borrador', label: 'Borradores', c: 'var(--muted)', hint: 'El guion todavía no está congelado.' },
];
const DONE = 'integrado';
const STATE_LABEL = { 'por-grabar': 'por grabar', grabado: 'grabado', importado: 'en producción', renderizado: 'renderizado', subido: 'subido en privado', publicado: 'publicado', borrador: 'borrador', integrado: 'en la lección' };
const state = { track: 'all', q: '' };

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function copyButton(text) {
  const b = el('button', null, 'Copiar');
  b.type = 'button';
  b.addEventListener('click', async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { /* fall back below */ }
    if (!ok) {
      const code = b.parentElement.querySelector('code');
      const r = document.createRange(); r.selectNodeContents(code);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
    b.textContent = ok ? 'Copiado' : 'Seleccionado'; b.classList.add('ok');
    setTimeout(() => { b.textContent = 'Copiar'; b.classList.remove('ok'); }, 1600);
  });
  return b;
}
function pathRow(label, value) {
  const r = el('div', 'path');
  r.append(el('label', null, label), el('code', null, value), copyButton(value));
  return r;
}
function card(i, color) {
  const c = el('article', 'card'); c.style.setProperty('--c', color);
  const top = el('div', 'top');
  top.append(el('h3', null, i.title), el('span', 'tag ' + i.track, i.track === 'gcti' ? 'GCTI' : 'Security+'), el('span', 'tag', i.lesson));
  const meta = el('div', 'meta');
  const add = (label, value) => { const s = el('span'); s.append(label + ' '); s.append(Object.assign(el('b'), { textContent: value })); meta.append(s); };
  add('Frases', i.segments);
  add('Palabras', i.words);
  add('Lectura', '≈ ' + String(i.minutes).replace('.', ',') + ' min');
  if (i.frozen) add('Congelado', i.frozen);
  if (i.adversary) add('Adversario', i.adversary);
  if (i.extraTakes) add('Tomas extra', i.extraTakes);
  c.append(top, meta);
  if (i.sheetPage) {
    const act = el('div', 'actions');
    const read = el('button', 'btn', 'Leer la hoja aquí');
    read.type = 'button';
    read.addEventListener('click', () => openReader(i));
    const tab = el('a', 'btn ghost', 'Abrir en pestaña');
    tab.href = i.sheetPage; tab.target = '_blank'; tab.rel = 'noopener';
    act.append(read, tab);
    c.append(act);
  }
  const paths = el('div', 'paths');
  if (i.sheet) paths.append(pathRow('Hoja', i.sheet));
  if (i.state === 'por-grabar' || i.state === 'borrador') paths.append(pathRow('Guardar', i.wav));
  if (i.youtubeId) paths.append(pathRow('YouTube', 'https://www.youtube.com/watch?v=' + i.youtubeId));
  if (i.vozWorktree) paths.append(pathRow('Rama ' + i.vozBranch, i.vozWorktree));
  else if (i.mp4) paths.append(pathRow('MP4', i.mp4));
  c.append(paths);
  return c;
}
function visible(i) {
  if (state.track !== 'all' && i.track !== state.track) return false;
  const q = state.q.trim().toLowerCase();
  return !q || (i.title + ' ' + i.lesson + ' ' + i.slug).toLowerCase().includes(q);
}
function render() {
  const items = DATA.items.filter(visible);
  const all = DATA.items.filter((i) => state.track === 'all' || i.track === state.track);
  const count = (k) => all.filter((i) => i.state === k).length;
  const stats = document.getElementById('stats'); stats.replaceChildren();
  [['por-grabar', 'por grabar', true], ['grabado', 'grabados sin importar'], ['importado', 'en producción'], ['renderizado', 'renderizados'], ['subido', 'subidos en privado'], ['publicado', 'publicados sin lección'], [DONE, 'en su lección']].forEach(([k, l, hot]) => {
    if (!count(k) && k !== 'por-grabar') return;
    const s = el('div', 'stat' + (hot && count(k) ? ' hot' : '')); s.append(el('b', null, String(count(k))), el('span', null, l)); stats.append(s);
  });
  const groups = document.getElementById('groups'); groups.replaceChildren();
  const wrap = el('div'); wrap.style.cssText = 'display:grid;gap:28px';
  for (const g of GROUPS) {
    const list = items.filter((i) => i.state === g.key);
    if (!list.length && g.key !== 'por-grabar') continue;
    const sec = el('section'); sec.style.setProperty('--c', g.c);
    const h = el('h2'); h.append(el('span', 'dot'), g.label, el('span', 'n', String(list.length)));
    sec.append(h, el('p', 'hint', g.hint));
    if (!list.length) sec.append(el('div', 'empty', 'Nada pendiente en este grupo.'));
    list.forEach((i) => sec.append(card(i, g.c)));
    wrap.append(sec);
  }
  const done = items.filter((i) => i.state === DONE);
  if (done.length) {
    const d = el('details'); d.append(el('summary', null, 'Ya en su lección (' + done.length + ')'));
    const l = el('div', 'list');
    done.forEach((i) => { const r = el('div', 'row'); r.append(el('span', null, i.title), el('span', 'slug', i.lesson + ' · ' + i.slug + (i.youtubeId ? ' · ' + i.youtubeId : '')), el('span', 'st', STATE_LABEL[i.state])); l.append(r); });
    d.append(l); wrap.append(d);
  }
  groups.append(wrap);
}
const reader = document.getElementById('reader');
const readerBody = document.getElementById('reader-body');
async function openReader(i) {
  document.getElementById('reader-title').textContent = i.title;
  document.getElementById('reader-tab').href = i.sheetPage;
  readerBody.replaceChildren(el('p', 'note', 'Cargando la hoja…'));
  reader.hidden = false;
  document.getElementById('reader-close').focus();
  try {
    const res = await fetch(i.sheetPage);
    if (!res.ok) throw new Error(res.status);
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    const art = doc.querySelector('article.sheet');
    if (!art) throw new Error('sin contenido');
    const copy = document.createElement('article'); copy.className = 'sheet';
    copy.append(...Array.from(art.childNodes).map((n) => document.importNode(n, true)));
    readerBody.replaceChildren(copy);
    readerBody.scrollTop = 0;
  } catch (e) {
    readerBody.replaceChildren(el('p', 'note', 'No se pudo cargar la hoja aquí. Usa "Abrir en pestaña".'));
  }
}
const closeReader = () => { reader.hidden = true; };
document.getElementById('reader-close').addEventListener('click', closeReader);
reader.addEventListener('click', (e) => { if (e.target === reader) closeReader(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !reader.hidden) closeReader(); });

const stamp = new Date(DATA.updated);
document.getElementById('stamp').textContent = 'Actualizado el ' + stamp.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }) + ' a las ' + stamp.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
document.querySelectorAll('.tools button').forEach((b) => b.addEventListener('click', () => {
  state.track = b.dataset.f;
  document.querySelectorAll('.tools button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  render();
}));
document.getElementById('q').addEventListener('input', (e) => { state.q = e.target.value; render(); });
render();
</script>
